[project]
authors = [{name = "mm21", email = "mm21.dev@gmail.com"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "pyrollup>=0.1.0,<0.2",
  "pyyaml>=6.0.2,<7"
]
description = "Pythonic multi-flavor Markdown generator"
license = "MIT"
license-files = ["LICENSE"]
name = "mdforge"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "0.2.2"

[project.urls]
homepage = "https://github.com/mm21/mdforge"

[dependency-groups]
dev = [
  "autoflake>=2.3.1,<3",
  "black>=24.8.0,<25",
  "docformatter>=1.7.7",
  "doit>=0.36.0,<0.37",
  "genbadge[tests]>=1.1.1,<2",
  "isort>=5.13.2,<6",
  "mypy>=1.11.2,<2",
  "nox>=2026.4.10",
  "pytest>=8.3.2,<9",
  "pytest-cov>=6.0.0,<7",
  "pytest-powerpack>=0.1.5,<0.2",
  "toml-sort>=0.24.2,<0.25"
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12.0"]

[tool.autoflake]
in_place = true
recursive = true
remove-all-unused-imports = true
remove-unused-variables = true

[tool.black]
quiet = true
target-version = ["py312", "py313"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.$"
]

[tool.docformatter]
black = true
in-place = true
make-summary-multi-line = true
non-strict = true
pre-summary-newline = true
recursive = true

[tool.doit]
verbosity = 2

[tool.isort]
profile = "black"
quiet = true

[tool.nox]
default_venv_backend = "uv"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -s -v -rA"
powerpack_underline = true
testpaths = ["test"]

[tool.tomlsort]
sort_first = ["project", "dependency-groups", "build-system"]
sort_table_keys = true
